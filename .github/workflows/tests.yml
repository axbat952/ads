name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: node build.mjs
      # dist/ is committed so the extension can be loaded unpacked without a
      # build step. This check keeps it in sync with src/.
      - name: Check dist/ is up to date
        run: git diff --exit-code -- dist/
      - name: Test
        run: node --test tests/*.test.mjs
